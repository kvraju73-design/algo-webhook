# Fly.io config — Mumbai region (closest to Flatrade India servers)
app = "tv-flatrade-bridge"
primary_region = "bom"        # bom = Mumbai

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = false   # keep alive — no cold starts
  auto_start_machines = true
  min_machines_running = 1      # always 1 machine running

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
