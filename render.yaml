services:
  - type: web
    name: tv-flatrade-bridge
    runtime: python
    region: singapore          # <-- this is the key change vs Railway US
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FLATRADE_API_KEY
        sync: false            # you fill this in Render dashboard
      - key: FLATRADE_API_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
    healthCheckPath: /health
